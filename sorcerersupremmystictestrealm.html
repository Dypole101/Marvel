rift.rotation.z+=sdt*.4;rift2.rotation.z-=sdt*.7;if(!rewing&&!dead){enemies(sdt);padCheck(p);laserUpd(dt);visorUpd();if(T-lastHit>6&&hp<100){hp=Math.min(100,hp+4*dt);setHp()}}
